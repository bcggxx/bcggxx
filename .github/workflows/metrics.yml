name: Metrics

on:
  # 每12小时自动运行一次
  schedule:
    - cron: "0 */12 * * *"
  # 每次 push 时触发(忽略 metrics 自动提交的产物,避免循环触发)
  push:
    paths-ignore:
      - "github-metrics.svg"
  # 允许手动点击按钮触发运行
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate self-hosted metrics
        uses: lowlighter/metrics@latest
        with:
          # 优先使用 classic PAT(完整数据:仓库数、磁盘占用、私有贡献等)
          # 未配置 METRICS_TOKEN 时回退到 GITHUB_TOKEN(仓库作用域,数据不完整)
          # 注意: fine-grained PAT 不支持 GraphQL 认证,不能用于 metrics
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: bcggxx
          template: classic
          filename: github-metrics.svg
          config_timezone: Asia/Shanghai
