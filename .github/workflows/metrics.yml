name: Metrics

on:
  # 每12小时自动运行一次
  schedule:
    - cron: "0 */12 * * *"
  # 每次 push 时触发(忽略 metrics 自动提交的产物,避免循环触发)
  push:
    paths-ignore:
      - "github-metrics.svg"
  # 允许手动点击按钮触发运行
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate self-hosted metrics
        uses: lowlighter/metrics@latest
        with:
          # 使用 GITHUB_TOKEN(fine-grained PAT 不支持 GraphQL,无法用于 metrics)
          # 注意: GITHUB_TOKEN 属主是 github-actions[bot],所以必须显式指定 user
          token: ${{ secrets.GITHUB_TOKEN }}
          user: bcggxx
          template: classic
          filename: github-metrics.svg
          config_timezone: Asia/Shanghai
